<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">PC PARTS STORE</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#about">About</a></li>
        </ul>
    </nav>

    <div class="main-wrapper">

        <section id="home" class="hero-section">
        <div class="hero-overlay">
            <h1 class="hero-title">
            Upgrade PC, Maksimalkan <span class="highlight-text">Performa</span>.
            </h1>
        </div>
        </section>

        <section id="products" class="products-section">
        <h2 class="section-title">Products</h2>
        
        <div class="products-grid">
            <div class="product-card">
            <div class="product-img-wrapper">
                <img src="ssd.jpg" alt="SSD">
            </div>
            <p class="product-name">SSD</p>
            </div>

            <div class="product-card">
            <div class="product-img-wrapper">
                <img src="ram.jpg" alt="RAM">
            </div>
            <p class="product-name">RAM</p>
            </div>

            <div class="product-card">
            <div class="product-img-wrapper">
                <img src="prosesor.jpg" alt="Prosesor">
            </div>
            <p class="product-name">Prosesor</p>
            </div>

            <div class="product-card">
            <div class="product-img-wrapper">
                <img src="GPU.jpg" alt="Kartu Grafis">
            </div>
            <p class="product-name">Kartu Grafis</p>
            </div>
        </div>
        </section>

        <section id="about" class="about-section">
        <h2 class="about-title">About</h2>
        <p class="about-desc">Pilihan komponen untuk kebutuhan upgrade PC kamu.</p>
        </section>
    </div>
</body>
</html>
