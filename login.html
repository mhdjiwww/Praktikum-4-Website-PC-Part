<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Part Website</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            height: 100vh;
            padding: 20px;
        }

        .card{
            background-color: whitesmoke;
            width: 100%;
            max-width: 360px;
            padding: 32px 28px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
        }

        .title{
            color: black;
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 6px ;
            font-family: Arial;
        }

        .subtitles{
            color: black;
            font-size: 0.85rem;
            margin-bottom: 24px;
            margin-top: 5px;
            font-family: arial;

        }

        .form-group{
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .form-group label{
            font-family: Arial;
            font-size: 0.85rem;
            color: black;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input{
            padding: 10px 14px;
            font-size: 0.9rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            background-color: #ffffff;
            transition: all 0.2s ease-in-out;
        }

        .button-submit{
            width: 100%;
            padding: 11px;
            background-color: #1d5b91;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease-in-out;
        }

        .button-submit:hover{
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="title">PC Parts Store</h2>
        <p class="subtitles"> Masuk untuk melihat komponen PC.</p>

        <form action="index.html" method="get">
            <div class="form-group">
                <label for="username">username</label>
                <input type="text" id="username" name="username" placeholder="Nama Pengguna" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Kata sandi" required>
            </div>

            <button type="submit" class="button-submit">Masuk</button>
        </form>
    </div>
</body>
</html>
